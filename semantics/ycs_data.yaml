# Semantic profile for the `ycs_data` dataset (D:/data/duckdb/ycs_data.duckdb or D:/data/sqlitedb/ycs_data.sqlite).
#
# This is the business-logic layer the LLM uses to translate domain questions
# into SQL. Tenor columns and the source/date columns are confirmed from
# src/mcp_data/data/populate_ycs.py. The country/source codes below are a
# starting point -- verify them against the actual `source` values in the DB
# (e.g. run: SELECT DISTINCT source FROM zero_rates) and extend as needed.

dataset: ycs_data
backend: duckdb
description: >
  Yield-curve and FX time series. zero_rates and par_rates hold one row per
  (source, date); the tenor columns (Y...) hold the rate for that maturity.
  swap_par_rates holds fixed-for-floating swap par rates and repo_rfr_rates
  holds repo / risk-free funding rates, one row per (ccy, coupon period(s),
  index, date). spotfx holds spot FX rates. window_corr holds rolling
  correlations.
  

vocabulary:
  # Values stored in the `source` column. Map the country name to its code.
  countries:
    Australia: AUS
    Austria: AUT
    Belgium: BEL
    Brazil: BRA
    Canada: CAN
    Switzerland: CHE
    China: CHN
    Germany: DEU
    Spain: ESP
    France: FRA
    United Kingdom: GBR
    Greece: GRC
    India: IND
    Ireland: IRL
    Italy: ITA
    Japan: JPN
    Korea: KOR
    Netherlands: NLD
    Portugal: PRT
    Russia: RUS
    United States: USA
    Bulgaria: BGR
    Colombia: COL
    Croatia: CRO
    Cyprus: CYP
    Czech Republic: CZE
    Denmark: DNK
    Estonia: EST
    Finland: FIN
    Mexico: MEX
    South Africa: ZAF
    Saudi Arabia: SAU
    Singapore: SGP
    Sweden: SWE
    Norway: NOR
    New Zealand: NZL
  currencies:
    USD: USD
    EUR: EUR
    GBP: GBP
    JPY: JPY
    CAD: CAD
    AUD: AUD
    NZD: NZD
    CHF: CHF
    CNY: CNY
  # Natural-language tenor -> tenor column name. Naming convention:
  # "Y" + zero-padded years, "p" replaces the decimal point
  # (e.g. 0.5Y -> Y000p5, 5Y -> Y005p0, 10Y -> Y010p0, 30Y -> Y030p0).
  tenors:
    "3M": Y000p25
    "6M": Y000p5
    "1Y": Y001p0
    "1.5Y": Y001p5
    "18M": Y001p5
    "2Y": Y002p0
    "24M": Y002p0
    "2.5Y": Y002p5
    "30M": Y002p5
    "3Y": Y003p0
    "36M": Y003p0
    "3.5Y": Y003p5
    "42M": Y003p5
    "4Y": Y004p0
    "48M": Y004p0
    "4.5Y": Y004p5
    "54M": Y004p5
    "5Y": Y005p0
    "6Y": Y006p0
    "7Y": Y007p0
    "8Y": Y008p0
    "9Y": Y009p0
    "10Y": Y010p0
    "11Y": Y011p0
    "12Y": Y012p0
    "13Y": Y013p0
    "14Y": Y014p0
    "15Y": Y015p0
    "16Y": Y016p0
    "17Y": Y017p0
    "18Y": Y018p0
    "19Y": Y019p0
    "20Y": Y020p0
    "25Y": Y025p0
    "30Y": Y030p0    
  index:
    "UNSPECIFIED": "Unspecified index for when the curve is specified as a full rate without an index"
    "LIBOR": "London Interbank Offered Rate"
    "SOFR": "Secured Overnight Financing Rate for USD"
    "ESTR": "EUR short term rate"
    "EONIA": "Euro Overnight Index Average for EUR"
    "TIBOR": "Tokyo Interbank Offered Rate for JPY"
    "SONIA": "Sterling Overnight Index Average for GBP"
    "FEDFUNDS": "Federal Funds Rate for USD"
    "EURIBOR": "Euro Interbank Offered Rate for EUR"
    "GBP LIBOR": "British Pound Interbank Offered Rate"
    "JPY LIBOR": "Japanese Yen Interbank Offered Rate"
    "CAD LIBOR": "Canadian Dollar Interbank Offered Rate"
    "AUD LIBOR": "Australian Dollar Interbank Offered Rate"
    "NZD LIBOR": "New Zealand Dollar Interbank Offered Rate"

conventions:
  date: >
    The `date` column is TEXT stored as 'YYYY-MM-DD'. Filter ranges with
    date >= '<start>' AND date <= '<end>'.
  tenor_columns: >
    Tenor columns follow the pattern Y<years:03d>p<tenths> (point replaced by 'p').
    To compute a spread between two tenors, subtract the two tenor columns.
  curve_keys: >
    swap_par_rates and repo_rfr_rates are keyed by currency (ccy), not by
    source/country. Filter swap curves on ccy (plus coupon_period,
    coupon_period_fixed and index when more than one combination exists) and
    repo curves on ccy (plus coupon_period and index). index is currently
    'UNSPECIFIED' for all rows. Swap and repo rates are different curves:
    swap par rates price derivatives, repo rates are funding/financing rates.
    A swap-repo spread joins the two tables on date and ccy. Rows where every
    tenor column is NULL mean no quote that day.

tables:
  zero_rates:
    description: >
      Zero-coupon (spot) rates per source and date. One row per (source, date);
      each tenor column holds the zero rate for that maturity.
    columns:
      date: {type: TEXT, description: "Observation date (YYYY-MM-DD)."}
      source: {type: TEXT, description: "Curve/country code, e.g. ITA=Italy, DEU=Germany."}
      Y000p5: {type: REAL, description: "6-month (0.5Y) zero rate."}
      Y001p0: {type: REAL, description: "1-year zero rate."}
      Y002p0: {type: REAL, description: "2-year zero rate."}
      Y003p0: {type: REAL, description: "3-year zero rate."}
      Y004p0: {type: REAL, description: "4-year zero rate."}
      Y005p0: {type: REAL, description: "5-year zero rate."}
      Y007p0: {type: REAL, description: "7-year zero rate."}
      Y010p0: {type: REAL, description: "10-year zero rate."}
      Y012p0: {type: REAL, description: "12-year zero rate."}
      Y015p0: {type: REAL, description: "15-year zero rate."}
      Y020p0: {type: REAL, description: "20-year zero rate."}
      Y025p0: {type: REAL, description: "25-year zero rate."}
      Y030p0: {type: REAL, description: "30-year zero rate."}
  par_rates:
    description: >
      Par rates per source and date, same tenor-column layout as zero_rates.
    columns:
      date: {type: TEXT, description: "Observation date (YYYY-MM-DD)."}
      source: {type: TEXT, description: "Curve/country code, e.g. ITA=Italy."}
      Y000p5: {type: REAL, description: "6-month (0.5Y) par rate."}
      Y001p0: {type: REAL, description: "1-year par rate."}
      Y002p0: {type: REAL, description: "2-year par rate."}
      Y003p0: {type: REAL, description: "3-year par rate."}
      Y004p0: {type: REAL, description: "4-year par rate."}
      Y005p0: {type: REAL, description: "5-year par rate."}
      Y007p0: {type: REAL, description: "7-year par rate."}
      Y010p0: {type: REAL, description: "10-year par rate."}
      Y012p0: {type: REAL, description: "12-year par rate."} 
      Y015p0: {type: REAL, description: "15-year par rate."}
      Y020p0: {type: REAL, description: "20-year par rate."}
      Y025p0: {type: REAL, description: "25-year par rate."}
      Y030p0: {type: REAL, description: "30-year par rate."}
  swap_par_rates:
    description: >
      Standard Fixed for Floating Swap Par rates per currency and date, similar tenor-column layout as zero_rates.
    columns:
      date: {type: TEXT, description: "Observation date (YYYY-MM-DD)."}
      ccy: {type: TEXT, description: "3 letter currency code, e.g. USD, EUR, GBP, JPY, etc."}
      coupon_period: {type: TEXT, description: "floating leg Coupon period, e.g. 1M, 3M, 6M, 1Y"}
      coupon_period_fixed: {type: TEXT, description: "fixed leg Coupon period, e.g. 1M, 3M, 6M, 1Y"}
      index: {type: TEXT, description: "Index for the floating leg, e.g. LIBOR, SOFR, ESTR, EONIA defaults to UNSPECIFIED"}
      Y000p25: {type: REAL, description: "3-month (0.25Y) swap par rate."}
      Y000p5: {type: REAL, description: "6-month (0.5Y) swap par rate."}
      Y001p0: {type: REAL, description: "1-year swap par rate."}
      Y002p0: {type: REAL, description: "2-year swap par rate."}
      Y003p0: {type: REAL, description: "3-year swap par rate."}
      Y004p0: {type: REAL, description: "4-year swap par rate."}
      Y005p0: {type: REAL, description: "5-year swap par rate."}
      Y006p0: {type: REAL, description: "6-year swap par rate."}
      Y007p0: {type: REAL, description: "7-year swap par rate."}
      Y008p0: {type: REAL, description: "8-year swap par rate."}
      Y009p0: {type: REAL, description: "9-year swap par rate."}
      Y010p0: {type: REAL, description: "10-year swap par rate."}
      Y015p0: {type: REAL, description: "15-year swap par rate."}
      Y020p0: {type: REAL, description: "20-year swap par rate."}
      Y025p0: {type: REAL, description: "25-year swap par rate."}
      Y030p0: {type: REAL, description: "30-year swap par rate."}
  repo_rfr_rates:
    description: >
      Repo rate at different terms per currency and date, similar tenor-column layout as zero_rates.
    columns:
      date: {type: TEXT, description: "Observation date (YYYY-MM-DD)."}
      ccy: {type: TEXT, description: "3 letter currency code, e.g. USD, EUR, GBP, JPY, etc."}
      coupon_period: {type: TEXT, description: "floating leg Coupon period, e.g. 1M, 3M, 6M, 1Y"}
      index: {type: TEXT, description: "Index for Repo Rate, e.g. LIBOR, SOFR, ESTR, EONIA defaults to UNSPECIFIED"}
      Y000p25: {type: REAL, description: "3-month (0.25Y) repo rate."}
      Y000p5: {type: REAL, description: "6-month (0.5Y) repo rate."}
      Y001p0: {type: REAL, description: "1-year repo rate."}
      Y002p0: {type: REAL, description: "2-year repo rate."}
      Y003p0: {type: REAL, description: "3-year repo rate."}
      Y004p0: {type: REAL, description: "4-year repo rate."}
      Y005p0: {type: REAL, description: "5-year repo rate."}
      Y006p0: {type: REAL, description: "6-year repo rate."}
      Y007p0: {type: REAL, description: "7-year repo rate."}
      Y008p0: {type: REAL, description: "8-year repo rate."}
      Y009p0: {type: REAL, description: "9-year repo rate."}
      Y010p0: {type: REAL, description: "10-year repo rate."}
      Y015p0: {type: REAL, description: "15-year repo rate."}
      Y020p0: {type: REAL, description: "20-year repo rate."}
      Y025p0: {type: REAL, description: "25-year repo rate."}
      Y030p0: {type: REAL, description: "30-year repo rate."}
  spotfx:
    description: Spot FX rates per source and date.
    columns:
      date: {type: TEXT, description: "Observation date (YYYY-MM-DD)."}
      source: {type: TEXT, description: "the type of data held by this table (spot_fx_rates), do not use this column"}
      GBPUSD: {type: REAL, description: "FX spot rate for converting USD to GBP (how much USD is needed for 1 GBP)"}
      EURUSD: {type: REAL, description: "FX spot rate for converting USD to GBP (how much USD is needed for 1 EUR)"}
      USDJPY: {type: REAL, description: "FX spot rate for converting JPY to USD (how much JPY is needed for 1 USD)"}
      USDCAD: {type: REAL, description: "FX spot rate for converting CAD to USD (how much CAD is needed for 1 USD)"}
      AUDUSD: {type: REAL, description: "FX spot rate for converting USD to AUD (how much USD is needed for 1 AUD)"}
      NZDUSD: {type: REAL, description: "FX spot rate for converting USD to NZD (how much USD is needed for 1 NZD)"}
      USDCHF: {type: REAL, description: "FX spot rate for converting CHF to USD (how much CHF is needed for 1 USD)"}
      USDCNY: {type: REAL, description: "FX spot rate for converting CNY to USD (how much CNY is needed for 1 USD)"}
      USDINR: {type: REAL, description: "FX spot rate for converting INR to USD (how much INR is needed for 1 USD)"}
      USDMXN: {type: REAL, description: "FX spot rate for converting MXN to USD (how much MXN is needed for 1 USD)"}
      USDBRL: {type: REAL, description: "FX spot rate for converting BRL to USD (how much BRL is needed for 1 USD)"}
      USDRUB: {type: REAL, description: "FX spot rate for converting RUB to USD (how much RUB is needed for 1 USD)"}
      USDKRW: {type: REAL, description: "FX spot rate for converting KRW to USD (how much KRW is needed for 1 USD)"}
  window_corr:
    description: >
      Rolling-window correlations between sources/observables.
    columns:
      date: {type: TEXT, description: "Observation date (YYYY-MM-DD)."}
      Correlation: {type: REAL, description: "the value of the rolling correlation over the window size for the zero_rates of the two sources for the term in the observable column"}
      observable: {type: TEXT, description: "The observable/term the correlation is computed for. One of the values in the 'tenors' column of the zero_rates table."}
      source1: {type: TEXT, description: "First source in the correlation pair. One of the values in the 'source' column of the zero_rates table."}
      source2: {type: TEXT, description: "Second source in the correlation pair. One of the values in the 'source' column of the zero_rates table."}
      window_size: {type: INTEGER, description: "Rolling window size in observations (e.g. 20, 40, 60, 90)."}
      corr_type: {type: TEXT, description: "Correlation type: 'pearson' or 'dcorr' (distance correlation)."}

examples:
  - q: "What is the highest absolute difference in zero rate between the 5Y and 10Y for Italy between 2010 and 2015?"
    sql: >
      SELECT MAX(ABS(Y010p0 - Y005p0)) AS max_abs_diff
      FROM zero_rates
      WHERE source = 'ITA'
        AND date >= '2010-01-01' AND date <= '2015-12-31'
  - q: "Average 10Y zero rate for Germany in 2012"
    sql: >
      SELECT AVG(Y010p0) AS avg_10y
      FROM zero_rates
      WHERE source = 'DEU'
        AND date >= '2012-01-01' AND date <= '2012-12-31'
  - q: "Which date had the steepest 2s10s slope (10Y minus 2Y) for Italy?"
    sql: >
      SELECT date, (Y010p0 - Y002p0) AS slope_2s10s
      FROM zero_rates
      WHERE source = 'ITA'
      ORDER BY slope_2s10s DESC
      LIMIT 1
  - q: "10Y USD swap par rate over 2023"
    sql: >
      SELECT date, Y010p0 AS swap_10y
      FROM swap_par_rates
      WHERE ccy = 'USD'
        AND date >= '2023-01-01' AND date <= '2023-12-31'
      ORDER BY date
  - q: "5Y EUR swap minus repo spread in basis points on 2024-01-02"
    sql: >
      SELECT s.date, (s.Y005p0 - r.Y005p0) * 100 AS swap_repo_5y_bp
      FROM swap_par_rates s
      JOIN repo_rfr_rates r ON r.date = s.date AND r.ccy = s.ccy
      WHERE s.ccy = 'EUR' AND s.date = '2024-01-02'
